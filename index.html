/* ---- Aujourd'hui ---- */
function agendaRow(x) {
  const s = toMin(x.start);
  const state = x.date !== today() || s == null ? '' : nowMin() >= endMin(x) ? 'past' : nowMin() >= s ? 'now' : '';
  return `<li class="ag ${state}" style="--c:${x.color}" data-action="open-item" data-kind="${x.kind}" data-id="${x.id}" data-date="${x.date}" tabindex="0">
    <div class="ag-time">${x.start ? `<b>${x.start}</b>${x.end ? `<span>${x.end}</span>` : ''}` : '<b>Journée</b>'}</div>
    <div class="ag-bar"></div>
    <div class="ag-main"><div class="ag-title">${x.highlight ? icon('star', 13, 'fill star') : ''}${esc(x.title)}</div>
      <div class="ag-meta">${x.kind === 'instance' ? `<span>${icon('clipboard', 12)} ${esc(x.sub || 'Instance')}</span>` : ''}${x.recurring ? `<span>${icon('repeat', 12)} Récurrent</span>` : ''}${x.location ? `<span>${icon('mapPin', 12)} ${esc(x.location)}</span>` : ''}${state === 'now' ? '<span class="badge green">En cours</span>' : ''}${state === 'past' ? '<span>Terminé</span>' : ''}</div>
    </div>
  </li>`;
}
function goalMini() {
  const n = wordsThisWeek(), g = S.settings.weeklyGoal;
  return `<div class="goal-mini"><div class="gm-top"><span>Objectif de la semaine</span><b>${n} / ${g} mots</b></div><div class="meter eng"><i style="width:${Math.min(100, n / g * 100)}%"></i></div></div>`;
}
function vToday() {
  const t = today(), tm = addDays(t, 1);
  const agenda = agendaFor(t);
  const over = S.tasks.filter(x => !x.done && x.due && x.due < t).sort(SORTS.smart);
  const tod = S.tasks.filter(x => !x.done && x.due === t).sort(SORTS.prio);
  const doneToday = S.tasks.filter(x => x.done && x.doneAt === t);
  const high = S.tasks.filter(x => !x.done && !x.due && x.priority === 'high');
  const total = over.length + tod.length + doneToday.length;
  const pct = total ? doneToday.length / total : 0;
  const due = S.vocab.filter(v => v.due <= t).length;
  const addedToday = S.vocab.filter(v => v.added === t).length;
  const acts = [];
  for (const i of S.instances) if (i.status === 'open') for (const a of i.actions) if (!a.done && a.due && a.due <= addDays(t, 2)) acts.push({ i, a });
  acts.sort((x, y) => x.a.due.localeCompare(y.a.due));
  const course = agenda.find(x => x.kind === 'event' && /anglais|english/.test(norm(x.title)));
  const wotd = wordOfDay();
  const agTm = agendaFor(tm), tasksTm = S.tasks.filter(x => !x.done && x.due === tm);
  const todo = over.length + tod.length;
  return `<section class="card today-hero">
    <div class="th-date"><div class="th-day">${esc(cap(DF.dayName.format(parseISO(t))))}</div><div class="th-full">${esc(fmt(t, 'long').replace(/^\S+\s/, ''))}</div><div class="th-week">Semaine ${isoWeek(t)}</div></div>
    <div class="th-sum">
      <div class="th-stat"><b>${agenda.length}</b><span>rendez-vous</span></div>
      <div class="th-stat"><b>${todo}</b><span>tâche${todo > 1 ? 's' : ''} à faire</span></div>
      <div class="th-stat"><b>${due}</b><span>carte${due > 1 ? 's' : ''} à réviser</span></div>
    </div>
    <div class="ring-box">${ring(pct, 76, 8, 'plan')}<div class="ring-txt"><b>${Math.round(pct * 100)}%</b><span>du jour</span></div></div>
    <button type="button" class="btn btn-sm th-print" data-action="print-today">${icon('printer', 15)}<span class="hide-sm">Imprimer</span></button>
  </section>
  ${wd(t) === 3 ? `<div class="banner eng">${icon('cap', 22)}<div><b>C'est jeudi : jour de cours d'anglais !</b><span>${course ? `Cours ${course.start ? 'à ' + course.start + (course.end ? '–' + course.end : '') : "aujourd'hui"}. ` : ''}Révisez vos cartes avant le cours, puis notez le résumé et les nouveaux mots.</span></div><div class="banner-actions"><button type="button" class="btn btn-sm" data-action="new-lesson">${icon('note', 15)} Notes de cours</button><button type="button" class="btn btn-sm btn-eng" data-action="new-vocab">${icon('plus', 15)} Nouveaux mots</button></div></div>` : ''}
  <div class="today-grid">
    <section class="card">
      <div class="card-head"><h3 class="card-title"><span class="ico plan">${icon('clock', 17)}</span>Programme du jour</h3><button type="button" class="btn btn-sm btn-ghost" data-action="new-event" data-date="${t}">${icon('plus', 15)} Ajouter</button></div>
      ${agenda.length ? `<ul class="agenda">${agenda.map(agendaRow).join('')}</ul>` : `<div class="mini-empty">${icon('calendar', 20)}<span>Aucun rendez-vous aujourd'hui.</span></div>`}
    </section>
    <section class="card">
      <div class="card-head"><h3 class="card-title"><span class="ico plan">${icon('listChecks', 17)}</span>Tâches du jour</h3><a class="btn btn-sm btn-ghost" href="#/tasks">Toutes ${icon('arrowRight', 14)}</a></div>
      <form class="inline-add" data-form="quick-task" autocomplete="off"><input type="hidden" name="due" value="${t}"><input type="hidden" name="priority" value="medium"><input class="input" name="title" placeholder="Ajouter une tâche pour aujourd'hui…" required maxlength="300" aria-label="Nouvelle tâche pour aujourd'hui"><button class="btn btn-primary" type="submit" aria-label="Ajouter la tâche">${icon('plus', 16)}</button></form>
      ${over.length ? `<div class="grp-lbl late">En retard · ${over.length}</div><div class="task-list">${over.map(taskRow).join('')}</div>` : ''}
      ${tod.length ? `<div class="grp-lbl">Aujourd'hui · ${tod.length}</div><div class="task-list">${tod.map(taskRow).join('')}</div>` : ''}
      ${doneToday.length ? `<div class="grp-lbl">Terminées aujourd'hui · ${doneToday.length}</div><div class="task-list">${doneToday.map(taskRow).join('')}</div>` : ''}
      ${!total ? `<div class="mini-empty">${icon('check', 20)}<span>Aucune tâche prévue aujourd'hui.</span></div>` : ''}
      ${high.length ? `<div class="grp-lbl">Priorité haute, sans échéance · ${high.length}</div><div class="task-list">${high.slice(0, 5).map(taskRow).join('')}</div>` : ''}
    </section>
    <section class="card">
      <div class="card-head"><h3 class="card-title"><span class="ico eng">${icon('book', 17)}</span>Anglais du jour</h3><a class="btn btn-sm btn-ghost" href="#/vocab">Vocabulaire ${icon('arrowRight', 14)}</a></div>
      <div class="review-box"><div class="rb-num"><b>${due}</b><span>carte${due > 1 ? 's' : ''} à réviser</span></div><button type="button" class="btn btn-eng" data-action="fc-start-due"${due ? '' : ' disabled'}>${icon('play', 15)} Réviser maintenant</button></div>
      ${goalMini()}
      ${wotd ? `<div class="wotd"><div class="wotd-lbl">${icon('sparkles', 14)} Mot du jour</div><div class="wotd-w"><b>${esc(wotd.en)}</b><button type="button" class="icon-btn sm" data-action="speak" data-text="${esc(wotd.en)}" aria-label="Écouter la prononciation">${icon('volume', 15)}</button></div><div class="wotd-fr">${esc(wotd.fr)}</div>${wotd.example ? `<div class="wotd-ex">« ${esc(wotd.example)} »</div>` : ''}</div>`
        : `<div class="mini-empty" style="margin-bottom:10px">${icon('sparkles', 20)}<span>Ajoutez des mots pour découvrir un « mot du jour ».</span></div>`}
      <div class="small muted">${addedToday ? `${plural(addedToday, 'mot ajouté', 'mots ajoutés')} aujourd'hui.` : "Aucun mot ajouté aujourd'hui."}</div>
    </section>
    ${acts.length ? `<section class="card"><div class="card-head"><h3 class="card-title"><span class="ico work">${icon('clipboard', 17)}</span>Actions d'instances à échéance</h3></div><ul class="act-list compact">${acts.map(({ i, a }) => actRow(i, a, true)).join('')}</ul></section>` : ''}
    <section class="card">
      <div class="card-head"><h3 class="card-title"><span class="ico">${icon('arrowRight', 17)}</span>Demain · ${esc(fmt(tm, 'medium'))}</h3></div>
      ${agTm.length || tasksTm.length ? `${agTm.length ? `<ul class="agenda">${agTm.map(agendaRow).join('')}</ul>` : ''}${tasksTm.length ? `<div class="grp-lbl">Tâches · ${tasksTm.length}</div><div class="task-list">${tasksTm.map(taskRow).join('')}</div>` : ''}`
        : `<div class="mini-empty">${icon('sun', 20)}<span>Rien de prévu pour demain.</span></div>`}
    </section>
  </div>`;
}
/* Registres des gestionnaires (délégation d'événements) */
const ACT = {}, CHG = {}, INP = {}, FORMS = {};
const UI = {
  inst: { q: '', status: 'all', type: '' },
  notes: { q: '', cat: '', tags: [], sort: 'recent' },
  vocab: { q: '', type: '', theme: '', level: '', sort: 'recent' },
  lessons: { q: '', kind: '' },
  tasks: { tab: 'todo', q: '', cat: '', sort: 'smart' },
  sched: { ws: null, day: null },
  fc: { deck: 'due', dir: '', theme: '', limit: 20 },
};
const setResults = html => { const r = $('#results'); if (r) r.innerHTML = html; };
const closeOwner = el => { const m = modals.find(x => x.el.contains(el)); if (m) closeModal(m); };
function removeWithUndo(coll, id, msg) {
  const idx = S[coll].findIndex(x => x.id === id);
  if (idx < 0) return;
  const [item] = S[coll].splice(idx, 1);
  commit();
  toast(msg, { action: { label: 'Annuler', fn: () => { if (!byId(coll, item.id)) { S[coll].splice(Math.min(idx, S[coll].length), 0, item); commit(); } } } });
}

/* ---- Travail : instances & réunions ---- */
const statusBadge = i => (i.status === 'open' ? '<span class="badge amber"><span class="dot"></span>Ouverte</span>' : '<span class="badge green"><span class="dot"></span>Clôturée</span>');
const splitLines = s => String(s || '').split('\n').map(l => l.trim().replace(/^([-*•]|\d+[.)])\s*/, '')).filter(Boolean);
function instFiltered() {
  const u = UI.inst;
  return S.instances.filter(i => (u.status === 'all' || i.status === u.status) && (!u.type || i.type === u.type)
    && matchQ(u.q, i.title, i.type, i.agenda, i.decisions, i.notes, i.participants, i.location, i.project, i.actions.map(a => a.text + ' ' + a.owner).join(' ')));
}
function vInstances() {
  const u = UI.inst;
  const all = S.instances.length, open = S.instances.filter(i => i.status === 'open').length;
  const n = { all, open, closed: all - open };
  const types = uniq(S.instances.map(i => i.type)).sort(localeCmp);
  if (u.type && !types.includes(u.type)) u.type = '';
  return pageHead('Instances & réunions', "Préparez vos réunions, consignez les décisions et suivez les actions jusqu'à leur clôture.", `<button type="button" class="btn btn-primary" data-action="new-instance">${icon('plus')} Nouvelle instance</button>`)
    + `<div class="toolbar">
      ${searchField('inst-q', u.q, 'Rechercher (titre, décision, participant…)')}
      <div class="seg" role="group" aria-label="Statut">${[['all', 'Toutes'], ['open', 'Ouvertes'], ['closed', 'Clôturées']].map(([k, l]) => `<button type="button" class="${u.status === k ? 'on' : ''}" data-action="inst-status" data-v="${k}" aria-pressed="${u.status === k}">${l}<span class="n">${n[k]}</span></button>`).join('')}</div>
      ${types.length > 1 ? `<select class="select sm" data-change="inst-type" aria-label="Type"><option value="">Tous les types</option>${types.map(t => `<option ${u.type === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>` : ''}
      ${all ? `<button type="button" class="btn btn-sm" data-action="print-instances">${icon('printer', 15)}<span class="hide-sm">Imprimer la liste</span></button>` : ''}
    </div>
    <div id="results">${instResults()}</div>`;
}
function instResults() {
  const list = instFiltered();
  if (!list.length) {
    return S.instances.length ? emptyState('search', 'Aucun résultat', 'Modifiez la recherche ou les filtres.')
      : emptyState('clipboard', 'Aucune instance pour le moment', 'Créez votre première fiche : ordre du jour, décisions prises et actions à suivre.', `<button type="button" class="btn btn-primary" data-action="new-instance">${icon('plus')} Créer une instance</button>`);
  }
  const t = today(), key = i => i.date + (i.start || '');
  const up = list.filter(i => i.date >= t).sort((a, b) => key(a).localeCompare(key(b)));
  const past = list.filter(i => i.date < t).sort((a, b) => key(b).localeCompare(key(a)));
  return (up.length ? `<div class="list-sec">À venir · ${up.length}</div><div class="inst-list">${up.map(instCard).join('')}</div>` : '')
    + (past.length ? `<div class="list-sec">Passées · ${past.length}</div><div class="inst-list">${past.map(instCard).join('')}</div>` : '');
}
function instCard(i) {
  const d = parseISO(i.date);
  const done = i.actions.filter(a => a.done).length, tot = i.actions.length;
  const late = i.status === 'open' && i.actions.some(a => !a.done && a.due && a.due < today());
  return `<article class="inst-card ${i.status}" data-action="open-instance" data-id="${i.id}" tabindex="0">
    <div class="inst-date"><span class="wd">${esc(DF.wdS.format(d).replace('.', ''))}</span><span class="dd">${d.getDate()}</span><span class="mm">${esc(DF.mon.format(d))}</span></div>
    <div class="inst-main">

function levelMatch(v, lvl, t) {
  switch (lvl) {

/* Prononciation (synthèse vocale du navigateur, voix locales en priorité) */
function speak(text) {
  if (!text) return;
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') { toast("La synthèse vocale n'est pas disponible dans ce navigateur.", { type: 'info' }); return; }
  try {
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const en = x => /^en[-_]/i.test(x.lang);
    const v = voices.find(x => en(x) && x.localService && /GB/i.test(x.lang)) || voices.find(x => en(x) && x.localService) || voices.find(x => en(x) && /GB/i.test(x.lang)) || voices.find(en);
    u.lang = v ? v.lang : 'en-GB';
    if (v) u.voice = v;
    u.rate = 0.92;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) { toast('Lecture audio impossible.', { type: 'error' }); }
}

const FC = { session: null };

    case 'due': return S.vocab.filter(v => v.due <= t);
    case 'week': return S.vocab.filter(v => v.added >= ws);
    case 'hard': return S.vocab.filter(v => v.lapses > 0 && v.box < 4);
    case 'theme': return S.vocab.filter(v => v.theme && v.theme === UI.fc.theme);

  const cards = list.slice(0, UI.fc.limit || list.length);

    queue: cards.map(c => c.id), pos: 0, flipped: false, graded: {}, requeued: {}, ok: 0, ko: 0, total: cards.length, practice, done: false,

function layoutLanes(items) {
  const list = items.map(x => ({ ...x, s: toMin(x.start), e: Math.min(endMin(x), 1440) })).sort((a, b) => a.s - b.s || b.e - a.e);
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    const lanes = [];
    for (const it of cluster) {
      let li = lanes.findIndex(end => end <= it.s);
      if (li < 0) { li = lanes.length; lanes.push(it.e); } else lanes[li] = it.e;
      it.lane = li;
    }
    cluster.forEach(it => { it.lanes = lanes.length; });
  };
  for (const it of list) {
    if (cluster.length && it.s >= clusterEnd) { flush(); cluster = []; clusterEnd = -1; }
    cluster.push(it);
    clusterEnd = Math.max(clusterEnd, it.e);
  }
  if (cluster.length) flush();

}

/* ===================== 7. Recherche globale ===================== */
function snippet(text, terms) {
  const s = String(text || '').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  const n = norm(s);
  let pos = -1;
  for (const t of terms) { pos = n.indexOf(t); if (pos >= 0) break; }
  if (pos < 0) return short(s, 90);
  const a = Math.max(0, pos - 30);
  return (a > 0 ? '…' : '') + s.slice(a, a + 100) + (a + 100 < s.length ? '…' : '');
}
function searchAll(q) {
  const terms = norm(q).split(/\s+/).filter(Boolean);
  const G = [];
  if (!terms.length) return { G, terms };
  const hit = (...f) => { const h = norm(f.join(' ')); return terms.every(t => h.includes(t)); };
  const add = (kind, label, ic, items) => { if (items.length) G.push({ kind, label, ic, items: items.slice(0, 6), total: items.length }); };
  add('instance', 'Instances & réunions', 'clipboard', S.instances.filter(i => hit(i.title, i.type, i.agenda, i.decisions, i.notes, i.participants, i.location, i.project, i.actions.map(a => a.text + ' ' + a.owner).join(' ')))
    .sort((a, b) => b.date.localeCompare(a.date)).map(i => ({ id: i.id, title: i.title, sub: snippet([i.agenda, i.decisions, plain(i.notes), i.participants, i.location, i.actions.map(a => a.text).join(' · ')].filter(Boolean).join(' · '), terms) || i.type, meta: fmt(i.date, 'short') })));
  add('note', 'Notes', 'note', S.notes.filter(n => hit(n.title, n.content, n.category, n.tags.join(' '))).sort((a, b) => b.updatedAt - a.updatedAt)
    .map(n => ({ id: n.id, title: n.title || 'Sans titre', sub: snippet(plain(n.content), terms) || n.category, meta: n.tags.join(', ') })));
  add('task', 'Tâches', 'listChecks', S.tasks.filter(x => hit(x.title, x.notes, x.category)).sort((a, b) => a.done - b.done)
    .map(x => ({ id: x.id, title: x.title, sub: [x.done ? 'Terminée' : PRIORITIES[x.priority].label, x.category].filter(Boolean).join(' · '), meta: x.due ? fmt(x.due, 'short') : '' })));
  add('vocab', 'Vocabulaire', 'book', S.vocab.filter(v => hit(v.en, v.fr, v.example, v.notes, v.theme))
    .map(v => ({ id: v.id, title: v.en, sub: v.fr + (v.example ? ' — ' + v.example : ''), meta: v.theme })));
  add('lesson', 'Cours & grammaire', 'cap', S.lessons.filter(l => hit(l.title, l.content)).sort((a, b) => b.date.localeCompare(a.date))
    .map(l => ({ id: l.id, title: l.title, sub: snippet(plain(l.content), terms), meta: fmt(l.date, 'short') })));
  add('event', 'Événements', 'bell', S.events.filter(e => hit(e.title, e.note, e.location))
    .map(e => ({ id: e.id, title: e.title, sub: recurText(e), meta: '' })));
  return { G, terms };
}
let spIdx = -1;

  const input = $('#search-input'), panel = $('#search-panel'), q = input.value;
  spIdx = -1;
  if (!q.trim()) { panel.hidden = true; return; }
  const { G, terms } = searchAll(q);

  if (!G.length) { panel.innerHTML = `<div class="sp-empty">${icon('search', 22)}<span>Aucun résultat pour « ${esc(q)} »</span></div>`; return; }
  panel.innerHTML = G.map(g => `<div class="sp-group"><div class="sp-gh">${icon(g.ic, 14)} ${g.label}<span>${g.total}</span></div>${g.items.map(it => `<button type="button" class="sp-item" data-action="open-result" data-kind="${g.kind}" data-id="${it.id}"><span class="sp-t">${hl(it.title, terms)}</span>${it.meta ? `<span class="sp-m">${esc(it.meta)}</span>` : ''}${it.sub ? `<span class="sp-s">${hl(it.sub, terms)}</span>` : ''}</button>`).join('')}${g.total > g.items.length ? `<div class="sp-more">+ ${g.total - g.items.length} autre(s)…</div>` : ''}</div>`).join('');
}

function searchKey(e) {
  const items = $$('#search-panel .sp-item');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!items.length) return;
    e.preventDefault();
    const down = e.key === 'ArrowDown';
    spIdx = spIdx < 0 ? (down ? 0 : items.length - 1) : (spIdx + (down ? 1 : -1) + items.length) % items.length;
    items.forEach((it, i) => it.classList.toggle('active', i === spIdx));
    items[spIdx].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const it = items[spIdx >= 0 ? spIdx : 0];
    if (it) it.click();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    e.stopPropagation();
    closeSearch(true);
    e.target.blur();
  }
}

/* ===================== 9. Sauvegarde : export / import JSON ===================== */
function exportData() {
  const payload = { app: APP_NAME, format: 'teh-backup', version: 1, exportedAt: new Date().toISOString(), data: S };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `task-english-hub_sauvegarde_${today()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  S.settings.lastBackup = Date.now();
  commit();
  toast('Sauvegarde exportée : conservez le fichier .json en lieu sûr.', { type: 'success', duration: 5000 });
}
function handleImportText(text, name) {
  let raw;
  try { raw = JSON.parse(text); } catch (e) { toast("Ce fichier n'est pas un JSON valide.", { type: 'error' }); return; }
  const data = raw && raw.format === 'teh-backup' && raw.data ? raw.data : raw;
  if (!data || typeof data !== 'object' || !COLLS.some(k => Array.isArray(data[k]))) { toast('Ce fichier ne ressemble pas à une sauvegarde Task&English Hub.', { type: 'error' }); return; }
  const inc = normalizeState(data);
  const when = raw && raw.exportedAt && !isNaN(Date.parse(raw.exportedAt)) ? fmt(toISO(new Date(raw.exportedAt)), 'long') : '';
  openModal({
    title: 'Importer une sauvegarde', size: 'md', headIcon: 'upload',
    body: `<p style="margin-bottom:12px">Fichier : <b>${esc(name)}</b>${when ? `<br><span class="small muted">Exporté le ${esc(when)}</span>` : ''}</p>
      <table class="mini-table"><thead><tr><th>Contenu</th><th style="text-align:right">Actuellement</th><th>Dans le fichier</th></tr></thead><tbody>${COLLS.map(k => `<tr><td>${COLL_LABELS[k]}</td><td style="text-align:right">${S[k].length}</td><td>${inc[k].length}</td></tr>`).join('')}</tbody></table>
      <div class="hint" style="margin-top:14px;flex-direction:column;gap:6px"><span><b>Fusionner</b> : ajoute les éléments du fichier et met à jour les plus récents, sans rien supprimer.</span><span><b>Remplacer</b> : vos données actuelles sont remplacées par celles du fichier.</span></div>`,
    footer: `<button type="button" class="btn" data-close>Annuler</button><span class="spacer"></span><button type="button" class="btn" data-imp="merge">${icon('copy', 16)} Fusionner</button><button type="button" class="btn btn-primary" data-imp="replace">${icon('download', 16)} Remplacer mes données</button>`,
    onOpen: el => el.querySelectorAll('[data-imp]').forEach(b => b.addEventListener('click', () => doImport(b.dataset.imp, inc))),
  });
}
function doImport(mode, inc) {
  const prev = JSON.stringify(S);
  if (mode === 'replace') S = inc;
  else {
    for (const k of COLLS) {
      const map = new Map(S[k].map(x => [x.id, x]));
      for (const x of inc[k]) { const cur = map.get(x.id); if (!cur) S[k].push(x); else if (x.updatedAt > cur.updatedAt) Object.assign(cur, x); }
    }
    for (const [d, n] of Object.entries(inc.reviewLog)) S.reviewLog[d] = Math.max(S.reviewLog[d] || 0, n);
  }
  S.settings.onboarded = true;
  FC.session = null;
  while (modals.length) closeModal();
  applyTheme();
  commit();
  toast(mode === 'replace' ? 'Données restaurées avec succès.' : 'Sauvegarde fusionnée avec vos données.', { type: 'success', duration: 10000, action: { label: 'Annuler', fn: () => { S = normalizeState(JSON.parse(prev)); applyTheme(); commit(); } } });
}

/* ===================== 10. Rappels ===================== */
const notifiedMem = {};
function loadNotified() {
  if (!storageOK) return notifiedMem;
  try { return JSON.parse(lsGet(NOTIF_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function checkReminders() {
  const now = Date.now(), t = today(), notified = loadNotified();
  let changed = false;
  for (const e of S.events) {
    if (e.remind == null || !e.start) continue;
    for (const d of [t, addDays(t, 1)]) {
      if (!occursOn(e, d)) continue;
      const start = parseISO(d);
      start.setHours(+e.start.slice(0, 2), +e.start.slice(3, 5), 0, 0);
      const key = e.id + '|' + d;
      if (now >= start.getTime() - e.remind * 60000 && now < start.getTime() + 5 * 60000 && !notified[key]) {
        notified[key] = now;
        changed = true;
        fireReminder(e, d, start.getTime());
      }
    }
  }
  if (changed) {
    for (const k in notified) if (now - notified[k] > 3 * 86400000) delete notified[k];
    if (storageOK) lsSet(NOTIF_KEY, JSON.stringify(notified));
  }
}
function fireReminder(e, d, startTs) {
  const mins = Math.round((startTs - Date.now()) / 60000);
  const when = mins <= 0 ? 'maintenant' : mins < 60 ? `dans ${mins} min` : d === today() ? `aujourd'hui à ${e.start}` : `demain à ${e.start}`;
  const msg = `${e.title} — ${when}${e.location ? ' (' + e.location + ')' : ''}`;
  toast('Rappel : ' + msg, { type: 'bell', duration: 0, action: { label: 'Voir', fn: () => go('events') } });
  if (S.settings.notify && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification(APP_NAME + ' — rappel', { body: msg, tag: e.id + d }); } catch (err) { /* notification système indisponible */ }
  }
  beep();
}
/* Le son n'est autorisé qu'après une interaction : le contexte audio est créé au premier clic */
let audioCtx = null;
document.addEventListener('pointerdown', () => {
  try { const C = window.AudioContext || window.webkitAudioContext; if (C && !audioCtx) audioCtx = new C(); } catch (e) { /* audio indisponible */ }
}, { once: true, capture: true });
function beep() {
  if (!audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime;
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0 + 0.65);
  } catch (e) { /* son indisponible */ }
}

function registerSW() {

/* Diagnostic : vérifie sur place tout ce dont Chrome a besoin pour installer l'application */
function imgSize(blob) {
  return new Promise(resolve => {
    const u = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); resolve({ w: im.naturalWidth, h: im.naturalHeight }); };
    im.onerror = () => { URL.revokeObjectURL(u); resolve(null); };
    im.src = u;
  });
}
async function probe(url, asImage = false) {
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) return { ok: false, why: `introuvable (erreur ${r.status})` };
    if (!asImage) return { ok: true, res: r };
    const size = await imgSize(await r.blob());
    return size ? { ok: true, w: size.w, h: size.h } : { ok: false, why: "présent mais ce n'est pas une image lisible" };
  } catch (e) {
    return { ok: false, why: `inaccessible (${(e && e.message) || 'erreur réseau'})` };
  }
}
async function installReport(forceWeb = false) {
  const rows = [];

  add(true, `Version de l'application : ${APP_VERSION}`, "Si vous attendiez une version plus récente, patientez 2 minutes (publication GitHub Pages) puis rechargez la page.");
  const web = forceWeb || isWeb, https = forceWeb || location.protocol === 'https:';
  add(https, https ? 'Adresse sécurisée (https)' : 'Adresse non sécurisée', https ? '' : "L'installation exige une adresse https:// (GitHub Pages en fournit une).");
  if (!web) {
    add(false, 'Ouverte en fichier local', "Publiez l'application sur GitHub Pages, puis ouvrez son adresse https sur le téléphone.");
    return rows;
  }
  const link = $('link[rel="manifest"]');
  const murl = new URL(link ? link.getAttribute('href') : 'manifest.json', location.href).href;
  let man = null;
  const pm = await probe(murl);
  if (!pm.ok) add(false, `manifest.json ${pm.why}`, "Envoyez manifest.json sur GitHub, au même endroit que index.html.");
  else {
    try { man = await pm.res.json(); add(true, 'manifest.json trouvé'); }
    catch (e) { add(false, 'manifest.json illisible', 'Le fichier a été modifié ou tronqué : renvoyez la version fournie.'); }
  }
  if (man) {
    const disp = ['standalone', 'fullscreen', 'minimal-ui'].includes(man.display);
    add(!!(man.name || man.short_name) && !!man.start_url && disp, 'Manifeste complet (nom, page de départ, plein écran)', disp ? '' : `display = « ${man.display} » : il faut « standalone ».`);
    let has192 = false, has512 = false;
    for (const ic of Array.isArray(man.icons) ? man.icons : []) {
      const want = String(ic.sizes || '').split(/\s+/)[0];
      const r = await probe(new URL(ic.src, murl).href, true);
      const good = r.ok && `${r.w}x${r.h}` === want;
      if (good && (!ic.purpose || /any/.test(ic.purpose))) { if (want === '192x192') has192 = true; if (want === '512x512') has512 = true; }
      add(good, `Icône ${ic.src}`, good ? `${r.w} × ${r.h} px` : r.ok ? `taille ${r.w} × ${r.h} au lieu de ${want}` : `${r.why} : envoyez ce fichier sur GitHub au même endroit que index.html.`);
    }

  }

    } catch (e) { add(null, 'Mode hors ligne : vérification impossible'); }
  }

  else if (installEvt) add(true, "Chrome propose l'installation", "Touchez « Installer l'application ».");
  else add(null, "Chrome n'a pas encore proposé l'installation", "Si toutes les lignes au-dessus sont vertes : l'appli est peut-être déjà installée (voir la liste des applications), un onglet de navigation privée est utilisé, ou le téléphone n'a pas les services Google (certains Huawei/Honor). Test : essayez d'installer squoosh.app ; si elle échoue aussi, le blocage vient du téléphone.");
  return rows;
}

  tipEl.style.top = y + 'px';
}
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('pointerout', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) tipEl.classList.remove('show'); });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('focusout', () => tipEl.classList.remove('show'));
window.addEventListener('scroll', () => tipEl.classList.remove('show'), { passive: true });

/* Synchronisation entre onglets ouverts sur la même application */
window.addEventListener('storage', e => {
  if (e.key !== KEY || e.newValue == null) return;
  try {
    S = normalizeState(JSON.parse(e.newValue));
    applyTheme();
    if (route === 'flashcards' && FC.session) updateChrome(); else refresh();
  } catch (err) { /* valeur illisible : ignorée */ }
});
const onMQ = (mq, fn) => { if (mq && mq.addEventListener) mq.addEventListener('change', fn); else if (mq && mq.addListener) mq.addListener(fn); };
onMQ(mqDark, () => { if (S.settings.theme === 'system') applyTheme(); });
onMQ(mqMobile, () => { if (route === 'schedule') renderView(); });

function boot() {
  buildChrome();
  applyTheme();
  const fav = $('link[rel="icon"]');
  if (fav) { fav.type = 'image/svg+xml'; fav.removeAttribute('sizes'); fav.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(logoSVG(64)); }
  window.addEventListener('load', () => { registerSW(); autoInstallCheck(); });
  const si = $('#search-input');
  si.addEventListener('keydown', searchKey);
  si.addEventListener('focus', () => { if (si.value.trim()) renderSearch(); });
  $('#import-file').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const rd = new FileReader();
    rd.onload = () => handleImportText(String(rd.result || ''), file.name);
    rd.onerror = () => toast('Lecture du fichier impossible.', { type: 'error' });
    rd.readAsText(file);
  });
  window.addEventListener('hashchange', () => {
    const r = readRoute(), changed = r !== route;
    route = r;
    closeDrawer();
    closeSearch(false);
    renderView();
    if (changed) window.scrollTo(0, 0);
  });
  route = readRoute();
  renderView();
  if (!S.settings.onboarded) {
    if (COLLS.some(k => S[k].length)) { S.settings.onboarded = true; save(); }
    else setTimeout(showWelcome, 300);
  }
  let lastDay = today();
  setInterval(() => {
    checkReminders();
    if (today() !== lastDay) { lastDay = today(); refresh(); return; }
    if (route === 'schedule') updateNowLine();
  }, 30000);
  setTimeout(checkReminders, 1500);
}
boot();
})();
</script>
